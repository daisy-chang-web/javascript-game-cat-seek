<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Whack-a-Meow: Cat & Seek." />
    <title>Whack-a-Meow: Cat &amp; Seek</title>
    <!-- favicon -->
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="images/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="images/apple-touch-icon.png"
    />
    <link rel="manifest" href="images/site.webmanifest" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Playfair:ital,opsz,wght@0,5..1200,300..900;1,5..1200,300..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles/normalize-fwd.css" />
    <link rel="stylesheet" href="styles/styles.css" />
    <script src="scripts/script.js" defer></script>
  </head>

  <body>
    <main class="start-screen">
      <section class="start-menu" aria-labelledby="game-title">
        <h1 id="game-title">
          Whack-a-Meow :
          <span>Cat & Seek</span>
        </h1>
        <nav class="menu-actions" aria-label="Main menu">
          <button class="menu-button menu-button-primary" type="button">
            Start Playing
          </button>
          <button class="menu-button" type="button">Credits</button>
        </nav>
      </section>

      <div class="game-screen" id="game-screen" aria-label="Game screen" hidden>
        <img
          class="game-background"
          src="images/game-bg.jpg"
          alt="An illustrated-style living room, with a cat sitting on the sofa, surrounded by plants and furniture"
        />
        <div class="game-status" aria-label="Game status">
          <output
            class="game-timer"
            id="game-timer"
            aria-label="Time remaining"
          >
            00:30
          </output>
          <output class="game-score" id="game-score" aria-label="Cats found">
            <img src="images/cat-energetic-idle.png" alt="Tabby cat peeking out" />
            <p id="cats-found">
              <span class="current-score">0</span>
              <span class="score-separator">/</span>
              <span class="max-score">30</span>
            </p>
          </output>
          <button
            class="pause-button"
            id="pause-button"
            type="button"
            aria-label="Pause game"
          >
            <span aria-hidden="true">Ⅱ</span>
          </button>
        </div>
      </div>
    </main>
  </body>
</html>
